name: Build and Push Docker Image

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build and push image
    uses: docker/build-push-action@v6
    with:
      push: true
      tags: |
        ${{ secrets.DOCKERHUB_USERNAME }}/meuapp:latest
        ${{ secrets.DOCKERHUB_USERNAME }}/meuapp:${{ github.sha }}
      cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/meuapp:latest
      cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/meuapp:latest,mode=max
